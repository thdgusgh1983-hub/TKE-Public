<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>사진대지 작성</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --purple:#662D91; --orange:#F26722;
    --grad:linear-gradient(110deg,#662D91 0%,#B24A6A 50%,#F26722 100%);
    --bg:#F4F3F6; --card:#fff; --text:#1C1B1F; --sub:#6B6870; --line:#E2E0E6; --danger:#C62828;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  :root{color-scheme:light}
  html,body{margin:0;background:var(--bg);color:var(--text);
    font-family:"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;font-size:16px}
  .wrap{max-width:560px;margin:0 auto;padding:0 16px 120px}
  header{background:#fff;border-bottom:1px solid var(--line);position:sticky;top:env(safe-area-inset-top,0px);z-index:5}
  header .in{max-width:560px;margin:0 auto;padding:12px 16px;display:flex;align-items:center;justify-content:space-between}
  header img{height:26px}
  header .t{font-weight:700;font-size:15px;color:var(--sub)}
  .bar{height:3px;background:var(--grad)}
  h2{font-size:15px;margin:22px 4px 8px;color:var(--purple);display:flex;align-items:center;gap:6px}
  h2 .n{width:22px;height:22px;border-radius:50%;background:var(--grad);color:#fff;font-size:12px;display:inline-flex;align-items:center;justify-content:center}
  .card{background:var(--card);border-radius:14px;padding:14px;border:1px solid var(--line)}
  label{display:block;font-size:13px;color:var(--sub);margin:10px 0 4px}
  label:first-child{margin-top:0}
  input[type=text],input[type=date],input[type=tel],input[type=email]{
    width:100%;padding:12px;border:1px solid var(--line);border-radius:10px;font:inherit;background:#fff;color:var(--text)}
  input:focus{outline:2px solid var(--orange);border-color:transparent}
  .row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .me{display:flex;justify-content:space-between;align-items:center}
  .me b{font-size:15px}
  .link{background:none;border:0;color:var(--orange);font:inherit;font-size:14px;padding:4px}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .slot{position:relative;aspect-ratio:3/4;border:2px dashed #CFCBD6;border-radius:12px;background:#FAF9FB;
    display:flex;flex-direction:column;align-items:center;justify-content:center;overflow:hidden;cursor:pointer}
  .slot.has{border:2px solid transparent}
  .slot img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
  .slot .plus{font-size:30px;color:#B9B4C2;line-height:1}
  .slot .hint{font-size:12px;color:var(--sub);margin-top:4px}
  .slot .cap{position:absolute;left:0;right:0;bottom:0;padding:6px;background:rgba(0,0,0,.55);color:#fff;font-size:13px;text-align:center;font-weight:500}
  .slot:not(.has) .cap{background:none;color:var(--text);position:static;padding:0 0 6px;font-weight:700}
  .slot .x{position:absolute;top:6px;right:6px;width:28px;height:28px;border-radius:50%;border:0;background:rgba(0,0,0,.6);color:#fff;font-size:16px;display:none}
  .slot.has .x{display:block}
  .slot input{display:none}
  .btn{display:block;width:100%;padding:15px;border:0;border-radius:12px;font:inherit;font-weight:700;font-size:16px;color:#fff;background:var(--grad);margin-top:12px}
  .btn.sec{background:#fff;color:var(--purple);border:1.5px solid var(--purple)}
  .btn:disabled{opacity:.5}
  .preview img{width:100%;border:1px solid var(--line);border-radius:6px;display:block}
  .msg{font-size:13px;color:var(--sub);margin-top:8px;line-height:1.5}
  .err{color:var(--danger)}
  .hidden{display:none!important}
  .banner{background:#FFF4E5;border:1px solid #F5C58A;color:#7A4A00;border-radius:12px;padding:12px;margin-top:14px;font-size:14px;line-height:1.5}
  .banner button{margin-top:8px;padding:9px 12px;border-radius:8px;border:0;background:var(--orange);color:#fff;font:inherit;font-weight:700;font-size:14px}
  .step{display:flex;align-items:center;flex-wrap:wrap;gap:8px;padding:8px 0;font-size:14px;border-bottom:1px solid var(--line)}
  .step:last-child{border-bottom:0}
  .step b{color:var(--orange)}
  .to{font-weight:700;word-break:break-all;user-select:all}
  .mini{padding:8px 12px;border-radius:8px;border:1.5px solid var(--purple);background:#fff;color:var(--purple);font:inherit;font-size:14px;font-weight:700;text-decoration:none}
  .toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#222;color:#fff;padding:12px 16px;border-radius:10px;font-size:14px;max-width:90%;text-align:center;opacity:0;transition:opacity .2s;pointer-events:none;z-index:20}
  .toast.on{opacity:1}
  /* 첫 실행 설정 */
  .modal{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:flex-end;justify-content:center;z-index:30}
  .modal .sheet{background:#fff;width:100%;max-width:560px;border-radius:18px 18px 0 0;padding:20px 16px 28px}
  .modal h3{margin:0 0 4px}
  .busy{position:fixed;inset:0;background:rgba(255,255,255,.7);display:flex;align-items:center;justify-content:center;z-index:40;font-weight:700;color:var(--purple)}
</style>
</head>

    const me = store.get("tke_me") || {};

    $("meName").textContent = me.name || "이름 미입력";
    return me;
  }
  function openMe(){
    const me = store.get("tke_me") || {};
    $("org").value = me.org || ""; $("name").value = me.name || "";
    $("meModal").classList.remove("hidden");
  }
  $("editMe").onclick = openMe;
  $("saveMe").onclick = () => {
    const org = $("org").value.trim(), name = $("name").value.trim();
    if(!org || !name){ toast("소속과 이름을 입력해주세요"); return; }
    store.set("tke_me",{org,name}); renderMe(); $("meModal").classList.add("hidden");
  };
  const me0 = renderMe();
  if(!me0.org || !me0.name) openMe();

  /* ---------- 날짜 기본값 ---------- */
  const t = new Date();
  $("date").value = t.getFullYear()+"-"+String(t.getMonth()+1).padStart(2,"0")+"-"+String(t.getDate()).padStart(2,"0");

  /* ---------- 사진 슬롯 ---------- */
  SLOTS.forEach((label,i)=>{
    const s = document.createElement("div");
    s.className = "slot";
    s.innerHTML = `<div class="cap">${label}</div><div class="plus">＋</div><div class="hint">탭해서 추가</div>
      <button class="x" aria-label="삭제">✕</button><input type="file" accept="image/*">`;
    const inp = s.querySelector("input");
    s.addEventListener("click", e => { if(e.target.classList.contains("x")) return; inp.click(); });
    s.querySelector(".x").addEventListener("click", e => {
      e.stopPropagation(); photos[i]=null; inp.value="";
      const im = s.querySelector("img"); if(im) im.remove(); s.classList.remove("has"); invalidate();
    });
    inp.addEventListener("change", async () => {
      const f = inp.files && inp.files[0]; if(!f) return;
      try{
        const c = await loadScaled(f, 1600);
        photos[i] = c;
        let im = s.querySelector("img");
        if(!im){ im = document.createElement("img"); s.prepend(im); }
        im.src = c.toDataURL("image/jpeg",0.7);
        s.classList.add("has"); invalidate();
      }catch(err){ toast("사진을 불러오지 못했어요"); }
    });
    $("grid").appendChild(s);
  });

  function loadScaled(file, max){
    return new Promise((res,rej)=>{
      const url = URL.createObjectURL(file);
      const img = new Image();
      img.onload = () => {
        const r = Math.min(1, max/Math.max(img.naturalWidth,img.naturalHeight));
        const c = document.createElement("canvas");
        c.width = Math.round(img.naturalWidth*r); c.height = Math.round(img.naturalHeight*r);
        c.getContext("2d").drawImage(img,0,0,c.width,c.height);
        URL.revokeObjectURL(url); res(c);
      };
      img.onerror = () => { URL.revokeObjectURL(url); rej(); };
      img.src = url;
    });
  }

  /* ---------- 받는 사람 ---------- */
  function recipient(){
    const v = $("to").value.trim();
    if(!v) return {type:null,v};
    if(/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v)) return {type:"email",v};
    const d = v.replace(/[^0-9]/g,"");
    if(/^01[0-9]{8,9}$/.test(d)) return {type:"phone",v:d};
    return {type:"bad",v};
  }
  $("to").addEventListener("input", ()=>{
    const r = recipient();
    $("toMsg").textContent = r.type==="email" ? "✉ 이메일로 보냅니다"
      : r.type==="phone" ? "💬 카톡/문자로 보냅니다" : "";
  });
  $("to").value = "";

  ["site","part","unit","date"].forEach(id => $(id).addEventListener("input", invalidate));
  function invalidate(){ pdfFile=null; $("result").classList.add("hidden"); }

  /* ---------- 사진대지 그리기 (A4, 150dpi) ---------- */
  const FONT = '"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif';
  function loadImg(src){ return new Promise(r=>{ const i=new Image(); i.onload=()=>r(i); i.src=src; }); }

  async function drawSheet(d){
    try{ await document.fonts.load('700 40px "Noto Sans KR"'); await document.fonts.load('400 24px "Noto Sans KR"'); }catch(e){}
    const W=1240,H=1754,M=80;
    const c=document.createElement("canvas"); c.width=W; c.height=H;
    const g=c.getContext("2d");
    g.fillStyle="#fff"; g.fillRect(0,0,W,H);

    // 상단 로고 + 그라데이션 라인
    const logo = await loadImg(LOGO);
    const lh=44, lw=logo.width*lh/logo.height;
    g.drawImage(logo, M, 56, lw, lh);
    g.font=`400 22px ${FONT}`; g.fillStyle="#6B6870"; g.textAlign="right"; g.textBaseline="middle";
    g.fillText(d.org, W-M, 78);
    const gr=g.createLinearGradient(M,0,W-M,0); gr.addColorStop(0,"#662D91"); gr.addColorStop(.5,"#B24A6A"); gr.addColorStop(1,"#F26722");
    g.fillStyle=gr; g.fillRect(M,124,W-2*M,5);

    // 제목
    g.fillStyle="#111"; g.textAlign="center"; g.font=`700 54px ${FONT}`;
    const title="사 진 대 지"; g.fillText(title, W/2, 200);
    const tw=g.measureText(title).width; g.fillRect(W/2-tw/2, 236, tw, 3);

    // 정보표
    const rows=[["현 장 명",d.site],["교체품목",d.part],["교체호기",d.unit],["작업일자",d.dateK],["작 성 자",d.org+"  "+d.name]];
    const tx=M, ty=280, rh=50, kw=190, tw2=W-2*M;
    g.lineWidth=1.5; g.strokeStyle="#333";
    rows.forEach((r,i)=>{
      const y=ty+i*rh;
      g.fillStyle="#F3EEF7"; g.fillRect(tx,y,kw,rh);
      g.strokeRect(tx,y,kw,rh); g.strokeRect(tx+kw,y,tw2-kw,rh);
      g.fillStyle="#333"; g.font=`500 23px ${FONT}`; g.textAlign="center"; g.fillText(r[0], tx+kw/2, y+rh/2+1);
      g.fillStyle="#111"; g.font=`400 24px ${FONT}`; g.textAlign="left"; fitText(g, r[1]||"", tx+kw+18, y+rh/2+1, tw2-kw-30);
    });

    // 사진 2x2
    const gy=ty+rows.length*rh+30, gap=0, cw=(W-2*M)/2, capH=48;
    const ch=(H-70-gy)/2 - capH;
    for(let i=0;i<4;i++){
      const col=i%2,row=Math.floor(i/2);
      const x=M+col*cw, y=gy+row*(ch+capH);
      const pad=10;
      g.fillStyle="#F4F4F4"; g.fillRect(x+pad,y+pad,cw-2*pad,ch-2*pad);
      if(photos[i]) drawCover(g, photos[i], x+pad,y+pad,cw-2*pad,ch-2*pad);
      else { g.fillStyle="#AAA"; g.font=`400 24px ${FONT}`; g.textAlign="center"; g.fillText("사진 없음", x+cw/2, y+ch/2); }
      g.strokeStyle="#333"; g.lineWidth=1.5; g.strokeRect(x,y,cw,ch);
      // 캡션
      const kx=110;
      g.fillStyle="#F3EEF7"; g.fillRect(x,y+ch,kx,capH);
      g.strokeRect(x,y+ch,kx,capH); g.strokeRect(x+kx,y+ch,cw-kx,capH);
      g.fillStyle="#333"; g.font=`500 22px ${FONT}`; g.textAlign="center";
      g.fillText("내 용", x+kx/2, y+ch+capH/2+1);
      g.font=`700 24px ${FONT}`; g.fillText(SLOTS[i], x+kx+(cw-kx)/2, y+ch+capH/2+1);
    }
    return c;
  }
  function fitText(g,s,x,y,max){
    let size=24; while(size>14 && g.measureText(s).width>max){ size--; g.font=`400 ${size}px ${FONT}`; }
    g.fillText(s,x,y);
  }
  function drawCover(g,img,x,y,w,h){
    const r=Math.max(w/img.width,h/img.height), sw=w/r, sh=h/r;
    g.drawImage(img,(img.width-sw)/2,(img.height-sh)/2,sw,sh,x,y,w,h);
  }

  /* ---------- 의존성 없는 PDF 생성 (JPEG 1장 = A4 1쪽) ---------- */
  function jpegToPdf(bytes, iw, ih){
    const enc = new TextEncoder();
    const parts=[], offs=[]; let len=0;
    const push = p => { const b = typeof p==="string" ? enc.encode(p) : p; parts.push(b); len+=b.length; };
    const obj = (n, body) => { offs[n]=len; push(`${n} 0 obj\n`); body(); push("\nendobj\n"); };
    const PW=595.28, PH=841.89;
    push("%PDF-1.4\n%\xE2\xE3\xCF\xD3\n");
    obj(1,()=>push("<< /Type /Catalog /Pages 2 0 R >>"));
    obj(2,()=>push("<< /Type /Pages /Kids [3 0 R] /Count 1 >>"));
    obj(3,()=>push(`<< /Type /Page /Parent 2 0 R /MediaBox [0 0 ${PW} ${PH}] /Resources << /XObject << /Im0 4 0 R >> >> /Contents 5 0 R >>`));
    obj(4,()=>{ push(`<< /Type /XObject /Subtype /Image /Width ${iw} /Height ${ih} /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length ${bytes.length} >>\nstream\n`); push(bytes); push("\nendstream"); });
    const cs = `q ${PW} 0 0 ${PH} 0 0 cm /Im0 Do Q`;
    obj(5,()=>push(`<< /Length ${cs.length} >>\nstream\n${cs}\nendstream`));
    const xref=len;
    let x="xref\n0 6\n0000000000 65535 f \n";
    for(let n=1;n<=5;n++) x+=String(offs[n]).padStart(10,"0")+" 00000 n \n";
    push(x+`trailer\n<< /Size 6 /Root 1 0 R >>\nstartxref\n${xref}\n%%EOF`);
    return new Blob(parts,{type:"application/pdf"});
  }

  /* ---------- 만들기 ---------- */
  $("make").onclick = async () => {
    const me = store.get("tke_me") || {};
    const d = { site:$("site").value.trim(), part:$("part").value.trim(), unit:$("unit").value.trim(),
      date:$("date").value, org:me.org||"", name:me.name||"" };
    const miss=[];
    if(!me.org||!me.name) miss.push("작성자");
    if(!d.site) miss.push("현장명"); if(!d.part) miss.push("부품명"); if(!d.unit) miss.push("교체호기");
    if(photos.every(p=>!p)) miss.push("사진");
    if(miss.length){ $("makeErr").textContent = miss.join(", ")+"을(를) 입력해주세요."; if(miss[0]==="작성자") openMe(); return; }
    const empty = SLOTS.filter((_,i)=>!photos[i]);
    $("makeErr").textContent="";
    $("busy").classList.remove("hidden");
    try{
      const [y,m,dd] = d.date ? d.date.split("-") : ["","",""];
      d.dateK = d.date ? `${y}년 ${+m}월 ${+dd}일` : "";
      const c = await drawSheet(d);
      const dataUrl = c.toDataURL("image/jpeg",0.85);
      $("prev").src = dataUrl;
      const bin = atob(dataUrl.split(",")[1]); const bytes = new Uint8Array(bin.length);
      for(let i=0;i<bin.length;i++) bytes[i]=bin.charCodeAt(i);
      const blob = jpegToPdf(bytes, c.width, c.height);
      const ymd = d.date.replace(/-/g,"");
      const safe = s => s.replace(/[\\/:*?"<>|#\s]+/g,"_");
      pdfFile = new File([blob], `사진대지_${safe(d.site)}_${safe(d.unit)}_${safe(d.part)}_${ymd}.pdf`, {type:"application/pdf"});
      meta = d;
      $("result").classList.remove("hidden");
      $("sendMsg").textContent = `PDF ${Math.round(blob.size/1024)}KB 준비 완료` + (empty.length ? ` · ${empty.join(", ")} 칸은 '사진 없음'으로 표시돼요` : "");
      $("manual").classList.add("hidden");
      setTimeout(()=>$("result").scrollIntoView({behavior:"smooth"}),50);
    }catch(e){ $("makeErr").textContent="만드는 중 오류가 났어요. 다시 시도해주세요."; }
    $("busy").classList.add("hidden");
  };

  function texts(){
    const d=meta;
    const subject = `[사진대지] ${d.site} / ${d.unit} / ${d.part} – ${d.org.replace(/^티케이엘리베이터\s*/,"")} ${d.name}`;
    const body = `안녕하세요, ${d.org} ${d.name}입니다.\n\n${d.site} ${d.unit} ${d.part} 작업을 완료하여 사진대지를 송부드립니다.\n\n- 현장명: ${d.site}\n- 교체품목: ${d.part}\n- 교체호기: ${d.unit}\n- 작업일자: ${d.dateK}\n\n감사합니다.\n${d.org} ${d.name} 드림`;
    return {subject, body};
  }

  /* ---------- 보내기 ---------- */
  $("send").onclick = () => {
    if(!pdfFile) return;
    const r = recipient();
    if(r.type!=="email" && r.type!=="phone"){ toast("받는 사람 이메일 또는 휴대폰번호를 확인해주세요"); $("to").focus(); return; }
    const {subject, body} = texts();
    // 받는 사람 복사 (await 하지 않음: 공유창 호출 권한 유지)
    try{ navigator.clipboard && navigator.clipboard.writeText(r.v).catch(()=>{}); }catch(e){}
    const data = {files:[pdfFile], title:subject, text: r.type==="email" ? body : `[사진대지] ${meta.site} ${meta.unit} ${meta.part} 작업 완료 사진 송부드립니다. - ${meta.org} ${meta.name}`};
    if(navigator.canShare && navigator.canShare({files:[pdfFile]})){
      navigator.share(data).then(()=>{
        $("sendMsg").textContent = "공유 완료";
      }).catch(err=>{
        if(err && err.name==="AbortError") return;
        fallback(r, subject, body);
      });
      toast(r.type==="email"
        ? `받는 사람(${r.v})이 복사됐어요. 메일 앱을 고른 뒤 받는사람 칸에 붙여넣기 하세요.`
        : `번호(${r.v})가 복사됐어요. 카톡 또는 메시지를 골라 보내세요.`);
    } else {
      fallback(r, subject, body);
    }
  };

  async function download(){
    if(window.claude && window.claude.use){
      try{
        const dl = await window.claude.use("downloads");
        if(dl){ try{ await dl.save({filename:pdfFile.name, data:pdfFile}); toast("PDF를 저장했어요"); }catch(e){ if(e&&e.code!=="declined") toast("PDF를 저장하지 못했어요"); } return; }
      }catch(e){}
    }
    const a=document.createElement("a"); a.href=URL.createObjectURL(pdfFile); a.download=pdfFile.name;
    document.body.appendChild(a); a.click(); setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},2000);
  }
  function fallback(r, subject, body){
    // 공유창을 쓸 수 없는 환경: 저장 → 복사 → 메일/문자 앱 순서로 안내
    $("sendMsg").textContent = "이 화면에서는 바로 공유가 안 돼요. 아래 순서대로 보내주세요.";
    $("mTo").textContent = r.v;
    $("mApp").textContent = r.type==="email" ? "메일 앱 열기" : "문자 앱 열기";
    $("mApp").href = r.type==="email"
      ? `mailto:${r.v}?subject=${encodeURIComponent(subject)}&body=${encodeURIComponent(body)}`
      : `sms:${r.v}${/iPhone|iPad/.test(ua)?"&":"?"}body=${encodeURIComponent("[사진대지] "+meta.site+" "+meta.unit+" "+meta.part+" 작업 완료 사진 송부드립니다.")}`;
    $("manual").classList.remove("hidden");
  }
  $("alt").onclick = () => { if(pdfFile) download(); };
  $("mSave").onclick = () => { if(pdfFile) download(); };
  $("mCopy").onclick = () => {
    const v=$("mTo").textContent;
    const ok=()=>toast("복사했어요");
    const sel=()=>{ const rg=document.createRange(); rg.selectNodeContents($("mTo")); const s=getSelection(); s.removeAllRanges(); s.addRange(rg); toast("길게 눌러 복사해주세요"); };
    try{ navigator.clipboard.writeText(v).then(ok, sel); }catch(e){ sel(); }
  };

  let tt; function toast(s){ const el=$("toast"); el.textContent=s; el.classList.add("on"); clearTimeout(tt); tt=setTimeout(()=>el.classList.remove("on"),3800); }
})();
</script>
